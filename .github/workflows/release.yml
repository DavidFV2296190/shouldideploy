name: Publish release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag name to publish (must match git tag)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SOLUTION_PATH: ShouldIDeployApp/ShouldIDeployApp.sln
      PROJECT_DIR: ShouldIDeployApp/src/ShouldIDeployApp
      PUBLISH_BASE: ShouldIDeployApp/publish
      APP_NAME: ShouldIDeployApp
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      - name: Restore solution
        run: dotnet restore ${{ env.SOLUTION_PATH }}
      - name: Run unit tests
        run: dotnet test ${{ env.SOLUTION_PATH }} --no-restore
      - name: Determine release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "release_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "release_tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          fi
        shell: bash
      - name: Publish self-contained builds
        run: |
          set -euxo pipefail
          runtimes=(win-x64 osx-x64 osx-arm64 linux-x64)
          mkdir -p "${{ env.PUBLISH_BASE }}"
          for runtime in "${runtimes[@]}"; do
            dotnet publish "${{ env.PROJECT_DIR }}" \
              -c Release -r "$runtime" \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:DebugType=None \
              -p:DebugSymbols=false \
              -o "${{ env.PUBLISH_BASE }}/${runtime}"

            publish_dir="${{ env.PUBLISH_BASE }}/${runtime}"
            if [[ "$runtime" == win-* ]]; then
              app_path="${publish_dir}/${{ env.APP_NAME }}.exe"
            else
              app_path="${publish_dir}/${{ env.APP_NAME }}"
              chmod +x "$app_path" || true
            fi

            if [[ ! -f "$app_path" ]]; then
              echo "Expected single-file app binary not found at: $app_path" >&2
              echo "Directory contents:" >&2
              ls -la "$publish_dir" >&2
              exit 1
            fi

            # Package only the single executable as the release asset.
            (
              cd "$publish_dir"
              zip -j "../${{ env.APP_NAME }}-${runtime}.zip" "$(basename "$app_path")"
            )
          done
        shell: bash
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: Should I Deploy Today? ${{ steps.tag.outputs.release_tag }}
          body_path: docs/release-notes.md
          files: |
            ShouldIDeployApp/publish/ShouldIDeployApp-win-x64.zip
            ShouldIDeployApp/publish/ShouldIDeployApp-osx-x64.zip
            ShouldIDeployApp/publish/ShouldIDeployApp-osx-arm64.zip
            ShouldIDeployApp/publish/ShouldIDeployApp-linux-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
