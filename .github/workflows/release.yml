name: Publish release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag name to publish (must match git tag)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      APP_DIR: ShouldIDeployApp
      SOLUTION_PATH: ShouldIDeployApp.sln
      PROJECT_DIR: src/ShouldIDeployApp
      PUBLISH_BASE: publish
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      - name: Restore solution
        working-directory: ${{ env.APP_DIR }}
        run: dotnet restore ${{ env.SOLUTION_PATH }}
      - name: Run unit tests
        working-directory: ${{ env.APP_DIR }}
        run: dotnet test ${{ env.SOLUTION_PATH }} --no-restore
      - name: Determine release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "release_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "release_tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          fi
        shell: bash
      - name: Publish self-contained builds
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euxo pipefail
          runtimes=(win-x64 osx-x64 osx-arm64 linux-x64)
          mkdir -p "${{ env.PUBLISH_BASE }}"
          for runtime in "${runtimes[@]}"; do
            dotnet publish "${{ env.PROJECT_DIR }}" \
              -c Release -r "$runtime" \
              --self-contained \
              -p:PublishSingleFile=true \
              -o "${{ env.PUBLISH_BASE }}/${runtime}"
            (
              cd "${{ env.PUBLISH_BASE }}/${runtime}"
              zip -r "../ShouldIDeployApp-${runtime}.zip" .
            )
          done
        shell: bash
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: Should I Deploy Today? ${{ steps.tag.outputs.release_tag }}
          body_path: docs/release-notes.md
          files: |
            ShouldIDeployApp/publish/ShouldIDeployApp-win-x64.zip
            ShouldIDeployApp/publish/ShouldIDeployApp-osx-x64.zip
            ShouldIDeployApp/publish/ShouldIDeployApp-osx-arm64.zip
            ShouldIDeployApp/publish/ShouldIDeployApp-linux-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
